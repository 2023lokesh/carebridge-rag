services:
  - type: web
    name: carebridge-vaccine-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CAREBRIDGE_BACKEND
        value: demo
      - key: CAREBRIDGE_GENERATION
        value: extractive
