name: Build real CDC fixed-window neural index
on:
  push:
    branches: ["course/freeze-fixed-index"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download original crawl evidence from verified run
        uses: actions/download-artifact@v4
        with:
          name: cdc-crawl-evidence-38016315533
          run-id: 38016315533
          github-token: ${{ github.token }}
          path: .
      - name: Verify 150 pages, five PDFs, three tables and raw hashes
        run: python -m carebridge.audit --require-thresholds
      - name: Install CPU-only Torch and neural dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt 'chromadb>=0.5,<2' 'sentence-transformers>=3,<6'
      - name: Build actual fixed-window neural embeddings in Chroma
        run: python -m carebridge.index --corpus data/normalized.jsonl --strategy fixed --db-dir data/chroma
      - name: Verify exact stored IDs and run a neural search
        run: python -m scripts.verify_fixed_index
      - name: Preserve index files and execution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carebridge-fixed-neural-index-${{ github.run_id }}
          path: |
            data/chroma/
            reports/fixed_index_smoke.json
            reports/01_ingestion_metrics.json
          retention-days: 7
          if-no-files-found: warn
